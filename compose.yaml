services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth:
    build: ./auth-service
    ports:
      - "8081:8081"
    env_file: .env
    networks:
      - default
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file: .env
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -X 'GET' 'http://localhost:8080/api/ping' -H 'accept: */*' | grep -q 'pong' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: on-failure

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - default
    depends_on:
      - auth
      - backend
    develop:
      watch:
        - path: ./frontend
          target: /app
          action: sync

volumes:
  pg-data:

networks:
  default:
    driver: bridge
