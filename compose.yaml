services:
  auth:
    build: ./auth-service
    ports:
      - "8081:8081"
    env_file: .env
    networks:
      - default
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    env_file: .env
    networks:
      - default
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    env_file: .env
    ports:
      - "5432:5432"
    networks:
      - default
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - default

volumes:
  pg-data:
